<div class="product-card">
  <div class="product-info">
    <h3 class="product-name">{{ name }}</h3>
    <p class="product-price">{{ price }} грн</p>
    <p class="product-description">{{ description }}</p>
  </div>
  
  <button class="buy-button" (click)="onBuyClick()">
    Купити
  </button>
</div>
